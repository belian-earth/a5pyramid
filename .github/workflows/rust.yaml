# The engine crate on its own, as it will be published: formatted, free of
# clippy warnings, and passing its tests without R.
on:
  push:
    branches: [main, master]
  pull_request:

name: rust.yaml

permissions: read-all

jobs:
  crate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust/a5pyramid
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -p a5pyramid --all-targets -- -D warnings
      - name: Test
        run: cargo test -p a5pyramid --release
      - name: Minimum supported Rust version
        run: |
          rustup toolchain install 1.88
          cargo +1.88 check -p a5pyramid
