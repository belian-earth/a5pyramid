[workspace]
members = ['a5pyramid']

# The R package's bindings. The engine is the `a5pyramid` crate in
# ./a5pyramid, which has no R dependency so it can be published on its own;
# this crate only converts between R objects and its types.
[package]
name = 'a5pyramid-r'
publish = false
version = '0.0.0'
edition = '2021'
rust-version = '1.88'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'a5pyramid_r'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
a5pyramid = { path = 'a5pyramid' }
a5 = '=1.0.0'
# ffi: the tiles reach R through the Arrow C stream interface
arrow-array = { version = '60', features = ['ffi'] }
arrow-schema = '60'
# already in the tree through parquet: concatenating an extra-column stream
arrow-select = '60'
extendr-api = '0.9.0'
rayon = '1.11'

[profile.release]
lto = true
codegen-units = 1
