[package]
name = 'a5pyramid'
version = '0.0.0'
edition = '2021'
rust-version = '1.88'
description = 'Level-of-detail pyramids of A5 cells, written to Parquet for browser rendering'
license = 'Apache-2.0'
repository = 'https://github.com/belian-earth/a5pyramid'
keywords = ['a5', 'dggs', 'parquet', 'geospatial', 'pyramid']
categories = ['science::geo']
# Published once the format and API settle; built today through the R package.
publish = false

[dependencies]
a5 = '=1.0.0'
arrow-array = '60'
arrow-buffer = '60'
arrow-schema = '60'
parquet = { version = '60', default-features = false, features = ['arrow', 'snap', 'zstd'] }
rayon = '1.11'
serde = { version = '1', features = ['derive'] }
serde_json = '1'
thiserror = '2'
